<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dungeon Dice</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2321192b'/><g transform='rotate(-9 32 32)'><rect x='10' y='12' width='44' height='44' rx='10' fill='%23a89b7e'/><rect x='10' y='8' width='44' height='44' rx='10' fill='%23f1e8d3' stroke='%23c9a25a' stroke-width='3'/><g fill='%232a2230'><circle cx='22' cy='20' r='4'/><circle cx='42' cy='20' r='4'/><circle cx='22' cy='40' r='4'/><circle cx='42' cy='40' r='4'/></g><circle cx='32' cy='30' r='4.5' fill='%23e8832f'/></g></svg>"><text y='.9em' font-size='90'>🎲</text></svg>">
<style>
:root{--bg:#15121a;--p1:#2a2332;--p2:#1c1722;--gold:#c9a25a;--torch:#f0a04b;--blood:#c9473d;--moss:#86b36b;--poi:#a574d8;--bone:#f1e8d3;--ink:#2a2230;--text:#ebe3d3;--mute:#a69cb4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px 12px 40px;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;top:12%;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,#f0a04b55,transparent 65%);animation:fk 3.2s infinite alternate;pointer-events:none;z-index:-1}
body::before{left:-150px}body::after{right:-150px;animation-delay:1.1s}
@keyframes fk{from{opacity:.45;transform:scale(.92)}to{opacity:.9;transform:scale(1.08)}}
h1,h2,h3{font-family:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;margin:0;font-weight:700}
.wrap{max-width:620px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:14px}
.top a,.top button{color:var(--mute);background:none;border:0;font:inherit;cursor:pointer;text-decoration:none;border-bottom:1px solid #4a4157;padding:0}
.top a:hover,.top button:hover{color:var(--torch)}
.panel{background:linear-gradient(var(--p1),var(--p2));border:1px solid #4a4157;border-radius:14px;box-shadow:inset 0 1px 0 #ffffff12,0 6px 18px #0007;position:relative}
.track{display:flex;gap:5px;justify-content:center;margin-bottom:10px}
.track i{width:22px;height:22px;border-radius:50%;background:#2a2332;border:1px solid #4a4157;font-size:11px;display:grid;place-items:center;font-style:normal;color:var(--mute)}
.track i.done{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.track i.cur{background:var(--torch);border-color:var(--torch);color:var(--ink);box-shadow:0 0 10px var(--torch)}
.hero{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:10px}
.hero .av{font-size:34px}
.hero .st{flex:1;min-width:0}
.line{display:flex;justify-content:space-between;font-size:14px;gap:8px;flex-wrap:wrap}
.bar{height:11px;background:#110e15;border-radius:6px;overflow:hidden;border:1px solid #3a3346;margin:3px 0}
.bar i{display:block;height:100%;transition:width .4s;background:linear-gradient(#a3d084,#6b9a52)}
.bar.e i{background:linear-gradient(#e0665b,#a2362d)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:12px}
.tags span{background:#110e15;border:1px solid #4a4157;border-radius:20px;padding:0 8px;color:var(--mute)}
.stage{padding:20px 14px 14px;text-align:center;margin-bottom:10px;background:radial-gradient(ellipse at 50% 35%,#4a3a52,transparent 70%),linear-gradient(var(--p1),var(--p2))}
.em{display:inline-block;line-height:0;animation:bob 3s ease-in-out infinite}.mon{width:158px;height:158px;display:block;filter:drop-shadow(0 8px 12px #000b)}.ey{filter:drop-shadow(0 0 4px #ffab4a)}
@keyframes bob{50%{transform:translateY(-6px)}}
.stage h2{font-size:24px;margin:2px 0 6px;letter-spacing:.5px}
.intent{margin-top:10px;display:inline-block;background:#110e15;border:1px solid var(--torch);color:var(--torch);border-radius:20px;padding:3px 14px;font-size:14px}
.trait{cursor:help;margin:0 3px;font-size:13px;color:var(--mute)}
.tray{padding:16px 10px 12px;margin-bottom:10px;background:linear-gradient(#3a2c26,#2a1f1b);border-color:#5a443a}
.dice{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;min-height:76px}
.die{width:68px;height:68px;border-radius:15px;background:radial-gradient(circle at 30% 25%,#fffaf0,var(--bone) 55%,#d9cdb2);border:0;padding:9px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);cursor:pointer;box-shadow:0 5px 0 #a89b7e,0 10px 14px #0008;transition:transform .12s}
.die i{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5a4a63,var(--ink));place-self:center}
.die:hover:not(:disabled){transform:translateY(-3px)}
.die.sel{outline:4px solid var(--torch);transform:translateY(-8px);box-shadow:0 5px 0 #a89b7e,0 0 22px var(--torch)}
.die:disabled{opacity:.2;box-shadow:none;cursor:default}
.die.roll{animation:rl .5s}
@keyframes rl{0%{transform:translateY(-30px) rotate(-200deg) scale(.6);opacity:0}70%{transform:rotate(15deg)}100%{transform:none;opacity:1}}
.chain{text-align:center;min-height:22px;margin-top:10px;font-size:14px;color:var(--torch)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
button.b{font:inherit;color:var(--text);background:linear-gradient(var(--p1),var(--p2));border:1px solid #4a4157;border-radius:12px;padding:10px 8px;cursor:pointer;transition:border-color .15s,transform .1s}
button.b:hover:not(:disabled){border-color:var(--torch);transform:translateY(-1px)}
button.b:disabled{opacity:.38;cursor:default}
button.b small{display:block;color:var(--mute);font-size:12px}
button.main{background:linear-gradient(#f3b062,#d4832f);color:#2a1a08;border-color:var(--torch);font-weight:700}
.row{display:flex;gap:10px;margin-bottom:10px}.row>*{flex:1}
.pots{display:flex;gap:8px;justify-content:center;margin-bottom:10px;min-height:38px;flex-wrap:wrap}
.pots button{font-size:20px;padding:2px 12px}
.log{text-align:center;color:var(--mute);font-size:14px;min-height:44px;padding:0 6px}
.fl{position:absolute;left:50%;top:40%;font:700 28px Georgia,serif;pointer-events:none;animation:up 1s forwards;text-shadow:0 2px 6px #000}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}
.fl{transform:translateX(-50%)}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-10px)}50%{transform:translateX(9px)}80%{transform:translateX(-4px)}}
.hit{animation:ht .45s}
@keyframes ht{from{box-shadow:0 0 0 4px var(--blood),0 6px 18px #0007}}
.center{text-align:center;padding:26px 14px}
.title{font-size:52px;letter-spacing:1px;background:linear-gradient(#ffe7b0,var(--gold) 60%,#8a6a2e);-webkit-background-clip:text;background-clip:text;color:transparent;margin:4px 0}
.center p{color:var(--mute);max-width:440px;margin:8px auto}
.grid{display:grid;gap:10px;margin-top:16px;text-align:left}
.grid button{display:flex;gap:12px;align-items:center;text-align:left}
.grid .ic{font-size:34px}
.grid b{font-size:17px}
.shop{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
:focus-visible{outline:3px solid var(--torch);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,body::before,body::after{animation:none!important;transition:none!important}}
@media(max-width:430px){.die{width:56px;height:56px;padding:7px}.die i{width:10px;height:10px}.mon{width:124px;height:124px}.title{font-size:40px}.track i{width:19px;height:19px}}

/* --- Feinschliff --- */
html::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 50% 40%,transparent 30%,#0b090e 100%),repeating-linear-gradient(0deg,#0000 0 38px,#ffffff09 38px 40px),repeating-linear-gradient(90deg,#0000 0 78px,#ffffff09 78px 80px),linear-gradient(#211a2b,#16121b)}
.panel{border-color:#6a5432;box-shadow:inset 0 0 0 3px #1c1722,inset 0 0 0 4px #4d3d26,inset 0 12px 30px #ffffff06,0 10px 26px #000a}
.top{font-family:"Palatino Linotype",Palatino,Georgia,serif;font-size:15px}
.track i.cur{animation:pl 1.6s infinite alternate}@keyframes pl{to{box-shadow:0 0 16px 2px var(--torch)}}
.hero .av{width:54px;height:54px;border-radius:50%;background:radial-gradient(#5a4668,#1c1722);border:2px solid var(--gold);display:grid;place-items:center;font-size:28px;box-shadow:0 0 12px #c9a25a44}
.bar{height:13px;border-radius:7px;box-shadow:inset 0 2px 4px #000}
.bar i{box-shadow:inset 0 3px 0 #ffffff40;border-radius:7px}
.stage{background:radial-gradient(ellipse at 50% 38%,var(--glow,#4a3a5266),transparent 72%),linear-gradient(var(--p1),var(--p2))}
.stage::before{content:"";position:absolute;left:12%;right:12%;bottom:0;height:46%;background:radial-gradient(ellipse at 50% 100%,#00000099,transparent 70%);pointer-events:none}
.em{position:relative;animation:none}.em .mon{animation:bob 3s ease-in-out infinite}
.em::after{content:"";position:absolute;left:14%;right:14%;bottom:-8px;height:14px;background:radial-gradient(#000c,transparent 70%)}
.em.enter .mon{animation:ent .7s cubic-bezier(.2,1.3,.4,1)}@keyframes ent{from{transform:translateY(-50px) scale(.6);opacity:0}}
.em.shake .mon{animation:fm .4s}@keyframes fm{30%{filter:brightness(2.6) saturate(0) drop-shadow(0 0 14px #fff)}}
.stage h2{font-size:26px;text-shadow:0 2px 0 #000}
.intent{background:linear-gradient(#1a1420,#110e15);box-shadow:0 0 12px #f0a04b33}
.tray{border:6px solid #5a3e2c;border-radius:16px;background:radial-gradient(ellipse at 50% 30%,#6a2f3b,#3a1a22);box-shadow:inset 0 0 28px #000b,0 8px 0 #3a281c,0 14px 24px #000a}
.die{box-shadow:0 5px 0 #a89b7e,0 10px 14px #000a,inset 0 2px 0 #fff,inset 0 -5px 8px #00000022}
.die.sel{box-shadow:0 5px 0 #a89b7e,0 0 26px 4px var(--torch),inset 0 2px 0 #fff}
.chain{text-shadow:0 1px 3px #000;color:#ffd9a0}
.acts button{padding:12px 6px;font-size:17px;border-top:3px solid var(--c,#4a4157)}
.acts button:nth-child(1){--c:var(--blood)}.acts button:nth-child(2){--c:#6aa5e0}.acts button:nth-child(3){--c:var(--moss)}
.acts button small{font-size:13px;margin-top:2px}
button.b:hover:not(:disabled){box-shadow:0 0 14px #f0a04b44}
button.main.pulse{animation:pu 1.2s infinite}@keyframes pu{50%{box-shadow:0 0 18px 3px var(--torch)}}
.fl{font-size:36px;-webkit-text-stroke:1.5px #000;paint-order:stroke fill}
.title{filter:drop-shadow(0 3px 0 #3a2a10) drop-shadow(0 0 18px #f0a04b55);letter-spacing:2px}
.logo{display:flex;justify-content:center;gap:12px;margin-bottom:6px}
.logo .die{width:56px;height:56px;padding:7px;cursor:default;animation:rl .8s backwards}
.logo .die:nth-child(1){transform:rotate(-14deg)}.logo .die:nth-child(2){transform:rotate(7deg) translateY(-10px);animation-delay:.12s}.logo .die:nth-child(3){transform:rotate(16deg);animation-delay:.24s}
.grid button{padding:14px 16px;border-left:3px solid var(--gold)}
.grid button:hover:not(:disabled){transform:translateX(4px)}
.grid .ic svg{display:block}
.sw>*{animation:in .4s both}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.center{padding:30px 16px}

/* --- Gegner-Aktion --- */
.intent{display:flex;align-items:center;gap:12px;width:100%;max-width:390px;margin:14px auto 0;padding:8px 16px;border-radius:12px;text-align:left;color:var(--text);font-size:14px;border:2px solid var(--ic,#e0665b);background:linear-gradient(#241a28,#120e16);box-shadow:0 0 14px #e0665b44}
.intent.atk{--ic:#e0665b}.intent.heavy{--ic:#ff4a3a;animation:hv 1s infinite alternate}.intent.heal{--ic:#86b36b;box-shadow:0 0 14px #86b36b44}
@keyframes hv{to{box-shadow:0 0 24px 3px #ff4a3a99}}
.ii{font-size:36px;line-height:1}
.it{flex:1;display:flex;flex-direction:column;line-height:1.3}
.it b{font:700 18px "Palatino Linotype",Palatino,Georgia,serif;color:var(--ic)}
.it small{font-size:13px;color:var(--mute)}
.intent.lethal{border-color:#ff2a2a;animation:hv .5s infinite alternate}.intent.lethal .it small{color:#ff8a7a;font-weight:600}
.in{font:700 38px Georgia,serif;color:var(--ic);text-shadow:0 2px 0 #000}
.in s{font-size:20px;opacity:.5;margin-right:6px}
.em.lunge .mon{animation:lg .55s}@keyframes lg{35%{transform:translateY(34px) scale(1.25)}}
.em.cast .mon{animation:cs .7s}@keyframes cs{40%{filter:brightness(1.6) drop-shadow(0 0 22px #86b36b)}}

/* --- Ergebnis des Gegnerzugs --- */
.elog{display:flex;align-items:center;gap:14px;margin:0 0 10px;padding:10px 16px;border-radius:12px;border:2px solid;animation:eb .45s}
.elog.hit{background:linear-gradient(#40181d,#260e12);border-color:#e0665b;animation:eb .45s,sh .35s .1s}.elog.hit .en{color:#ff6a5a}
.elog.block{background:linear-gradient(#142840,#0e1a2c);border-color:#6aa5e0}.elog.block .en{color:#9ec9ff}
.elog.heal{background:linear-gradient(#183020,#0f1e14);border-color:#86b36b}.elog.heal .en{color:#a3d084}
.en{font:700 42px Georgia,serif;min-width:76px;text-align:center;text-shadow:0 2px 0 #000;line-height:1}
.et{flex:1}.et b{display:block;font:700 19px "Palatino Linotype",Palatino,Georgia,serif}
.et small{color:var(--mute);font-size:13px}.et small i{font-style:normal;color:#c79bff}
@keyframes eb{from{transform:scale(.85);opacity:0}}
.vig{position:fixed;inset:0;pointer-events:none;z-index:9;box-shadow:inset 0 0 130px 35px #d02a1ecc;animation:vg .6s forwards}@keyframes vg{to{opacity:0}}

/* --- Inhalts-Update: Akte, Ereignisse, Händler, Reliquien, Erfolge --- */
html[data-act="1"]::before{filter:hue-rotate(-95deg) saturate(1.1)}
html[data-act="2"]::before{filter:hue-rotate(85deg) saturate(1.35)}
.track i.bs{border-color:var(--blood);color:#e0867d}
.track i.bs.done{background:var(--blood);border-color:var(--blood);color:var(--bone)}
.track i.bs.cur{background:var(--blood);border-color:var(--blood);color:var(--bone);box-shadow:0 0 12px var(--blood);animation:none}
.track i.gp{margin-right:7px}
.relics{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;font-size:18px;line-height:1}
.relics span{cursor:help;background:#110e15;border:1px solid #6a5432;border-radius:8px;padding:2px 5px}
.die.fz{position:relative}
.die.fz:disabled{opacity:.85;background:radial-gradient(circle at 30% 25%,#f4fbff,#a9d4ee 60%,#7fb4d6);box-shadow:0 5px 0 #5f93b4,0 0 16px #6fc6ff88}
.die.fz i{opacity:.3}
.die.fz::after{content:"❄️";position:absolute;inset:0;display:grid;place-items:center;font-size:32px}
.intent.buff{--ic:#f0a04b;box-shadow:0 0 14px #f0a04b44}
.intent.psn{--ic:#b98cf0;box-shadow:0 0 14px #a574d855}
.elog.buff{background:linear-gradient(#40300f,#261c08);border-color:#f0a04b}.elog.buff .en{color:#f0a04b}
.elog.psn{background:linear-gradient(#2c1a40,#1a0f28);border-color:#a574d8}.elog.psn .en{color:#c79bff}
.center p.evres{color:var(--text);font-size:17px;max-width:480px;margin:16px auto 20px;padding:12px 16px;background:#110e15;border:1px solid #4a4157;border-radius:12px}
.act-n{margin:0;letter-spacing:4px;text-transform:uppercase;color:var(--gold)!important}
details{margin-top:18px;text-align:left}
summary{cursor:pointer;color:var(--gold);font:700 18px "Palatino Linotype",Palatino,Georgia,serif;text-align:center;padding:4px}
.li{display:grid;gap:6px;margin-top:10px;text-align:left}
.li>div{display:flex;gap:10px;align-items:center;padding:6px 12px;border-radius:10px;background:#110e15;border:1px solid #3a3346}
.li>div.off{opacity:.45}
.li .ai{font-size:24px;width:32px;text-align:center;flex:none}
.li b{font-size:15px}
.li small{display:block;color:var(--mute);font-size:12px;line-height:1.35}
.shopl{display:grid;gap:8px;margin-top:14px;text-align:left}
.shopl button{display:flex;gap:12px;align-items:center;text-align:left}
.shopl .ic{font-size:30px;width:36px;text-align:center;flex:none}
.shopl .pr{margin-left:auto;font:700 16px Georgia,serif;color:var(--gold);white-space:nowrap;padding-left:6px}
.seg{display:flex;gap:8px;margin-top:10px}
.seg button{flex:1}
.seg button.on{border-color:var(--torch);background:linear-gradient(#3a2c1c,#2a1f14);box-shadow:0 0 12px #f0a04b44}
#toasts{position:fixed;top:10px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:20;pointer-events:none}
.toast{background:linear-gradient(#3a2c1a,#241a0e);border:2px solid var(--gold);border-radius:12px;padding:8px 16px;box-shadow:0 8px 24px #000b;animation:ti 3.4s forwards;font-size:14px;max-width:92vw}
.toast b{color:var(--gold)}
@keyframes ti{0%{transform:translateY(-30px);opacity:0}10%,85%{transform:none;opacity:1}100%{opacity:0;transform:translateY(-10px)}}
@media(max-width:430px){.track{gap:3px}.track i{width:17px;height:17px;font-size:10px}.track i.gp{margin-right:5px}}

</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span id="gold"></span><span><button onclick="mute=!mute;this.textContent=mute?'Ton aus':'Ton an'">Ton an</button> &nbsp; <a href="https://iamera.github.io/GameHub/">Alle Spiele</a></span></div>
  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>
</div>
<script>
const $=s=>document.querySelector(s),R=n=>Math.floor(Math.random()*n);
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const DF='⚀⚁⚂⚃⚄⚅';
const ROOMS=15,BOSSR=[5,10,15];
const ACTS=[
 {n:'Akt I',t:'Das Verlies',x:'Feuchte Mauern, tropfendes Wasser, irgendwo scharrt etwas im Dunkeln. Die Tür hinter dir ist längst verschwunden.'},
 {n:'Akt II',t:'Die Katakomben',x:'Der Knochenkönig ist gefallen, doch unter dem Thron öffnet sich ein Schacht in die Gräber der Alten. Hier flüstern die Toten.'},

const CLS={war:{n:'Krieger',e:'🛡️',d:'Zäh und stark: 40 LP, Angriffe +1',hp:40,dice:3,atk:1,blk:0,rr:1,min:1,gold:0,pots:[]},
 mag:{n:'Magier',e:'🔮',d:'Kluge Hände: 4 Würfel, 2 Neuwürfe, nur 28 LP',hp:28,dice:4,atk:0,blk:0,rr:2,min:1,gold:0,pots:[]},
 sch:{n:'Schurke',e:'🗡️',d:'Gezinkte Würfel (mind. 2), 20 Gold, 32 LP',hp:32,dice:3,atk:0,blk:0,rr:1,min:2,gold:20,pots:[]},
 pal:{n:'Paladin',e:'⚜️',d:'Heiliger Schutz: Schilde +1, heilt nach jedem Kampf 3 LP mehr, 36 LP',hp:36,dice:3,atk:0,blk:1,rr:1,min:1,gold:0,pots:[],reg:3},
 alc:{n:'Alchemist',e:'⚗️',d:'Tränke wirken 50% stärker, trägt 4 Tränke, startet mit Heil- und Feuertrank, 30 LP',hp:30,dice:3,atk:0,blk:0,rr:1,min:1,gold:10,pots:['heal','fire'],alc:1},
 ber:{n:'Berserker',e:'🪓',d:'Je weniger LP, desto mehr Schaden: unter 50% +2, unter 25% +4. 34 LP',hp:34,dice:3,atk:0,blk:0,rr:1,min:1,gold:0,pots:[],ber:1}};

const POOL=[
 [['rat','Riesenratte',''],['bat','Höhlenfledermaus',''],['sli','Schleimling','g'],['pil','Sporenpilz','e'],['kob','Kobold-Plünderer','w']],
 [['ske','Skelettkrieger','a'],['spi','Giftspinne','g'],['gob','Goblin','w'],['zom','Zombie','r'],['ice','Eisgeist','f'],['gar','Gargoyle','ad']],
 [['gho','Wiedergänger','a'],['orc','Ork','w'],['bas','Basilisk','g'],['dmn','Blutdämon','v'],['fir','Feuerelementar','d'],['gol','Steingolem','ar']]];
const BOSS={

 for(let n=0;n<2&&pool.length;n++){const r=pool.splice(R(pool.length),1)[0],sp=r.t.indexOf(' ');st.push({ico:r.t.slice(0,sp),t:r.t.slice(sp+1),d:r.d,p:26+R(14),ok:r.ok,f:r.f})}

  <div class="panel stage" id="stage" style="--glow:${glow}"><span class="em${fe?' shake':''}${e.fresh?' enter':''}${fa===1?' lunge':fa===2?' cast':''}">${mon(e.em)}</span><h2>${e.nm}</h2>
  <div class="bar e" style="max-width:280px;margin:0 auto"><i style="width:${e.hp/e.max*100}%"></i></div>
  <div style="font-size:13px;color:var(--mute)">${e.hp}/${e.max} LP${[...e.tr].map(c=>`<span class="trait" title="${TR[c][2]}">${TR[c][0]} ${TR[c][1]}${c==='w'&&e.rage?' +'+e.rage:''}${c==='p'&&e.ph?' ✔':''}</span>`).join('')}${e.pz?`<span class="trait" style="color:var(--poi)">☠️ Gift ${e.pz}</span>`:''}</div>
  ${intent}</div>
  ${S.elog?`<div class="elog ${S.elog.k}"><span class="en">${S.elog.n}</span><span class="et"><b>${S.elog.t}</b><small>${S.elog.s||''}${S.elog.p?` · <i>☠️ ${S.elog.p}</i>`:''}</small></span></div>`:''}
  <div class="panel tray"><div class="dice">${S.d.map(dieHTML).join('')}</div>
  <div class="chain">${S.chain?`🔗 Kette ×${S.chain}: gleiche Zahl nacheinander gibt +${CH()}`:sel&&S.last===sel?`🔗 Gleiche Zahl wie zuvor: +${CH()} Bonus`:left?'Tippe einen Würfel an. Jeder weitere Würfel auf dieselbe Aktion gibt 1 weniger. Verteile deine Würfel!':'Alle Würfel verbraucht. Beende die Runde.'}</div></div>
  <div class="acts"><button class="b" onclick="use('atk')" ${sel?'':'disabled'}>⚔️ Angriff<small>${sel?dmgOf(Math.max(1,pr-c.atk),sel,c.atk)+' Schaden':'Schaden'}${c.atk?` (−${c.atk})`:''}</small></button>
  <button class="b" onclick="use('blk')" ${sel?'':'disabled'}>🛡️ Schild<small>${sel?(Math.max(1,pr-c.blk)+S.blk)+' Block':'Block'}${c.blk?` (−${c.blk})`:''}</small></button>
  <button class="b" onclick="use('heal')" ${sel?'':'disabled'}>❤️ Heilen<small>${sel?(Math.ceil(Math.max(1,pr-c.heal)/2)+1)+' LP':'LP'}${c.heal?` (−${c.heal})`:''}</small></button></div>
  <div class="pots">${S.pots.map((k,j)=>`<button class="b" title="${POT[k][1]}: ${POT[k][2]}" onclick="usePot(${j})">${POT[k][0]}</button>`).join('')}</div>
  <div class="row"><button class="b" onclick="reroll()" ${S.rl<1||!left?'disabled':''}>🔄 Neu würfeln (${S.rl})</button><button class="b main${left?'':' pulse'}" onclick="endTurn()">Runde beenden</button></div>
  <div class="log">${S.log}</div>`;
 Q.forEach(([t,w,c])=>{const s=document.createElement('span');s.className='fl';s.textContent=t;s.style.color=c;$(w==='e'?'#stage':'#hero').appendChild(s)});
 if(fh){const v=document.createElement('div');v.className='vig';document.body.appendChild(v);setTimeout(()=>v.remove(),650)}
 Q=[];fe=fh=anim=fa=0;if(S.en)S.en.fresh=0}
document.addEventListener('keydown',ev=>{if(!S||S.screen!=='fight')return;const k=ev.key.toLowerCase();
 if(k>='1'&&k<='6'&&S.d[+k-1])pick(+k-1);else if(k==='a')use('atk');else if(k==='s')use('blk');else if(k==='h')use('heal');else if(k==='r')reroll();else if(k==='enter')endTurn()});
render();

</script>
</body>
</html>
